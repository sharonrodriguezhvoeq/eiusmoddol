<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Row Header Layout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="table-container">
        <table id="data-table">
            <thead>
                <tr>
                    <th></th>
                    <th>Column 1</th>
                    <th>Column 2</th>
                    <th>Column 3</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th>Row 1</th>
                    <td>Data 1-1</td>
                    <td>Data 1-2</td>
                    <td>Data 1-3</td>
                </tr>
                <tr>
                    <th>Row 2</th>
                    <td>Data 2-1</td>
                    <td>Data 2-2</td>
                    <td>Data 2-3</td>
                </tr>
                <tr>
                    <th>Row 3</th>
                    <td>Data 3-1</td>
                    <td>Data 3-2</td>
                    <td>Data 3-3</td>
                </tr>
            </tbody>
        </table>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
